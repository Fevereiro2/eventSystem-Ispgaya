<!doctype html>
<html lang="pt">
  <body style="margin:0; padding:0; background:#f4f7fb; font-family:Arial,Helvetica,sans-serif; color:#1f2937;">
    <div style="max-width:720px; margin:0 auto; padding:32px 20px;">
      <div style="background:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden;">
        <div style="padding:24px 32px; background:#0f172a; color:#ffffff;">
          <div style="display:flex; align-items:center; gap:14px;">
            <div style="width:54px; height:54px; border-radius:14px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; overflow:hidden;">
              <img src="cid:{{ logo_cid }}" alt="ISPGAYA" style="display:block; width:40px; height:auto; max-height:40px;" />
            </div>
            <div>
              <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.8;">
                {{ from_name }}
              </div>
              <div style="margin-top:4px; font-size:14px; color:#cbd5e1;">
                InfoCultura Newsletter
              </div>
            </div>
          </div>
          <h1 style="margin:18px 0 0; font-size:32px; line-height:1.15; letter-spacing:-0.02em;">{{ subject }}</h1>
          {% if preview_text %}
            <p style="margin:12px 0 0; font-size:15px; line-height:1.6; color:#cbd5e1;">
              {{ preview_text }}
            </p>
          {% endif %}
        </div>

        {% if image_url %}
        <div style="background:#ffffff; border-bottom:1px solid #e5e7eb; text-align:center;">
          <img src="{{ image_url }}" alt="{{ subject }}" style="display:inline-block; max-width:100%; height:auto; max-height:300px; width:auto;" />
        </div>
        {% endif %}

        <div style="padding:32px; background:#ffffff;">
          <div style="font-size:16px; line-height:1.8; color:#111827; white-space:normal;">
            {{ body|linebreaksbr }}
          </div>
        </div>

        <div style="padding:18px 32px; border-top:1px solid #e5e7eb; background:#f8fafc; font-size:12px; line-height:1.6; color:#64748b;">
          <p style="margin:0;">
            Enviado por {{ from_name }} &lt;{{ from_email }}&gt;
          </p>
          <p style="margin:6px 0 0;">
            Se este email chegou por engano, podes ignorar esta mensagem.
          </p>
          <p style="margin:10px 0 0;">
            <a href="#" style="color:#0f172a; text-decoration:none; font-weight:600;">ISPGAYA</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
