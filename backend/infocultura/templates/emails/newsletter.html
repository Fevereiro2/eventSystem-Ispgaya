<!doctype html>
<html lang="pt">
  <body style="margin:0; padding:0; background:#f4f7fb; font-family:Arial,Helvetica,sans-serif; color:#1f2937;">
    <div style="max-width:720px; margin:0 auto; padding:32px 20px;">
      <div style="background:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden;">
        <div style="padding:28px 32px; background:#0f172a; color:#ffffff;">
          <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.8;">
            {{ from_name }}
          </div>
          <h1 style="margin:10px 0 0; font-size:28px; line-height:1.2;">{{ subject }}</h1>
          {% if preview_text %}
            <p style="margin:12px 0 0; font-size:15px; line-height:1.6; color:#cbd5e1;">
              {{ preview_text }}
            </p>
          {% endif %}
        </div>

        <div style="padding:32px; background:#ffffff;">
          <div style="font-size:16px; line-height:1.75; color:#111827; white-space:normal;">
            {{ body|linebreaksbr }}
          </div>
        </div>

        <div style="padding:18px 32px; border-top:1px solid #e5e7eb; background:#f8fafc; font-size:12px; line-height:1.6; color:#64748b;">
          <p style="margin:0;">
            Enviado por {{ from_name }} &lt;{{ from_email }}&gt;
          </p>
          <p style="margin:6px 0 0;">
            Se este email chegou por engano, podes ignorar esta mensagem.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
